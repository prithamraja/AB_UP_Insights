# =============================================================================
# sources.yaml — declarative source-table registration for the PM-JAY domain pack
# =============================================================================
# Consumed by src/build_views.py (step 1: "Register sources").
#
# For every source table:
#   file          source filename inside --data-dir (.parquet or .csv)
#   expected_rows approximate row count (validation CHECK 1 applies +/- tolerance)
#   casts         column -> logical type. Everything NOT listed here stays a
#                 string (VARCHAR). IDs are strings, so they are simply omitted.
#
# Supported cast types (see build_views.py CAST_EXPR):
#   timestamp  parse as an instant, express in UTC, strip tz  -> TIMESTAMP (tz-naive)
#              (mirrors pandas `to_datetime(..., utc=True).tz_localize(None)`;
#               the runner runs the DuckDB session in UTC so naive strings are
#               assumed UTC and offset-bearing strings are converted to UTC).
#   date       calendar date, no time                          -> DATE
#   float      numeric measure                                 -> DOUBLE
#   int        integer count / year / rank                     -> BIGINT
#   bool       True/False flag                                 -> BOOLEAN
#
# The runner reads every source as raw text — CSVs with all_varchar=true (no
# type sampling — a reproducibility hazard), Parquet as written by
# scripts/csv_to_parquet.py (every column VARCHAR) — and applies these casts
# explicitly. This is the "explicit types over auto_detect" rule from the handoff.
# =============================================================================

row_count_tolerance_pct: 20   # CHECK 1: |actual-expected|/expected must be < this

tables:

  # ── Reference ──────────────────────────────────────────────────────────────
  ref_up_geography:
    file: ref_up_geography.parquet
    expected_rows: 1000

